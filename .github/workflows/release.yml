# Builds and tests everything on a clean Windows runner, then publishes the
# release for a pushed v* tag. Third-party mod JARs are fetched from their
# publishers and hash-verified; they are not attached to the release.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne '${{ github.ref_name }}') { throw "Tag ${{ github.ref_name }} does not match VERSION $version" }

      - name: Build and test native modules
        shell: cmd
        run: tools\build-native.cmd

      - name: Build and test Fabric guest
        shell: cmd
        working-directory: mc
        run: gradlew.bat build --console=plain --no-configuration-cache

      - name: Fetch pinned NeoForge mods
        run: python tools/fetch-neoforge-mods.py

      - name: Build and test NeoForge guest
        shell: pwsh
        working-directory: mc-neoforge
        run: |
          & .\gradlew.bat build --console=plain *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/neoforge-build.txt"
          if ($LASTEXITCODE) {
            # Surface the cause as annotations, which are readable without downloading logs.
            Get-ChildItem build/test-results/test -Filter *.xml -ErrorAction SilentlyContinue | ForEach-Object {
              $xml = [xml](Get-Content $_.FullName -Raw)
              foreach ($case in $xml.testsuite.testcase) {
                foreach ($problem in @($case.failure) + @($case.error)) {
                  if ($problem) { $text = ($problem.InnerText -split "`n" | Select-Object -First 15) -join '%0A'; Write-Output "::error title=$($case.classname).$($case.name)::$text" }
                }
              }
            }
            $tail = (Get-Content "$env:RUNNER_TEMP/neoforge-build.txt" | Select-Object -Last 40) -join '%0A'
            Write-Output "::error title=NeoForge Gradle output::$tail"
            exit 1
          }

      - name: Upload NeoForge test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-test-reports
          path: mc-neoforge/build/reports/tests/

      - name: Package release
        run: python tools/package-release.py

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: EndCraft-release
          path: dist/

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $files = Get-ChildItem "dist/release-$version" -File | ForEach-Object FullName
          gh release create '${{ github.ref_name }}' @files --title "EndCraft $version" --notes-file "docs/RELEASE-$version.md"
